# Local development services. Start with: docker compose up -d db
services:
  db:
    # PostgreSQL 16 with the pgvector extension (0.8 or newer) for vector search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mini_rag
      POSTGRES_PASSWORD: mini_rag
      POSTGRES_DB: mini_rag
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the mini_rag_test database used by the test suite.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_rag -d mini_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
