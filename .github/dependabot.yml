# Dependabot keeps dependencies fresh — opens PRs grouped by ecosystem.
# Limits each kind to 5 open PRs at a time so review queues stay sane.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "deps(github-actions)"

  # Python dependencies, pinned in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(pip)"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The web app's packages (frontend/package-lock.json).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
