name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mini_rag
          POSTGRES_PASSWORD: mini_rag
          POSTGRES_DB: mini_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_rag -d mini_rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mini_rag:mini_rag@localhost:5432/mini_rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build

  eval:
    # Retrieval quality on the handbook dataset with a real embedding model,
    # nomic-embed-text in Ollama: a metric that drops below the baseline fails.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mini_rag
          POSTGRES_PASSWORD: mini_rag
          POSTGRES_DB: mini_rag_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_rag -d mini_rag_eval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      ollama:
        image: ollama/ollama:0.35.1
        ports:
          - 11434:11434
    env:
      DATABASE_URL: postgresql+asyncpg://mini_rag:mini_rag@localhost:5432/mini_rag_eval
      EMBEDDING_BASE_URL: http://localhost:11434/v1
      EMBEDDING_MODEL: nomic-embed-text:v1.5
      EMBEDDING_DIMENSIONS: '768'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Pull the embedding model
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:11434/api/version; then break; fi
            sleep 2
          done
          docker exec ${{ job.services.ollama.id }} ollama pull nomic-embed-text:v1.5
      - name: Migrate the database
        run: alembic upgrade head
      - name: Evaluate retrieval
        run: mini-rag eval evals/handbook/v1 --output eval-report.json --save-baseline eval-baseline.json && cat eval-baseline.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore

  docker:
    # Builds the images and runs the full compose stack: database, migrations, API, web app.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build --detach
      - name: Wait for the stack to be healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Upload a file through the API
        run: |
          echo "Mini RAG in Docker." > notes.txt
          curl --fail --silent -F "file=@notes.txt;type=text/plain" http://localhost:8000/api/v1/data/upload/demo
      - name: The web app serves its pages and forwards the API
        run: |
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="app">'
          curl --fail --silent http://localhost:3000/projects/demo/documents | grep -q '<div id="app">'
          curl --fail --silent http://localhost:3000/api/v1/projects | grep -q '"name":"demo"'
          curl --fail --silent --output /dev/null http://localhost:3000/docs
      - name: The API and the web app run as unprivileged users
        run: |
          test "$(docker compose exec -T app id -u)" = "10001"
          test "$(docker compose exec -T web id -u)" != "0"
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
