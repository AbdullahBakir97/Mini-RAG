name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mini_rag
          POSTGRES_PASSWORD: mini_rag
          POSTGRES_DB: mini_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_rag -d mini_rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mini_rag:mini_rag@localhost:5432/mini_rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  docker:
    # Builds the image and runs the full compose stack: database, migrations, API.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build --detach
      - name: Wait for the API to be healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Upload a file through the API
        run: |
          echo "Mini RAG in Docker." > notes.txt
          curl --fail --silent -F "file=@notes.txt;type=text/plain" http://localhost:8000/api/v1/data/upload/demo
      - name: The API runs as an unprivileged user
        run: test "$(docker compose exec -T app id -u)" = "10001"
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
